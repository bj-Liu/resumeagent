<text x="70" y="274" class="heading">Harness Runtime — execution management center</text>
<text x="75" y="310" class="label">Create → plan → concurrent page generation → render → evaluate → bounded refinement → validate → complete</text>
<text x="75" y="337" class="small">Finite retries · conditional branches · cancellation · request and Run deadlines · artifact-aware checkpoint recovery</text>
<rect x="75" y="360" width="225" height="105" rx="9" fill="#f9fbf6" stroke="#cbd9c5"/>
<text x="95" y="389" class="heading">State</text>
<text x="95" y="415" class="label">Run / Task / Page</text>
<text x="95" y="436" class="label">SQLite checkpoints</text>
<rect x="320" y="360" width="225" height="105" rx="9" fill="#f9fbf6" stroke="#cbd9c5"/>
<text x="340" y="389" class="heading">Context</text>
<text x="340" y="415" class="label">Stage-specific inputs</text>
<text x="340" y="436" class="label">Bounded history</text>
<rect x="565" y="360" width="225" height="105" rx="9" fill="#f9fbf6" stroke="#cbd9c5"/>
