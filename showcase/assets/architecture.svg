<text x="1075" y="415" class="label">Run-queryable events</text>
<text x="1075" y="436" class="label">Redacted diagnostics</text>
<rect x="1300" y="360" width="225" height="105" rx="9" fill="#f9fbf6" stroke="#cbd9c5"/>
