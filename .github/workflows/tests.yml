name: Offline Python regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall resumeagent harness storage mcp evals examples tests
      - run: python -m evals.run_tests --output test-artifacts/ci-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-log
          path: test-artifacts/ci-tests.log
